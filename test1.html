
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon World</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080817;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 40px;
            border: 2px solid #9b4dff;
            border-radius: 20px;
            box-shadow: 0 0 30px #9b4dff;
            background: #121225;
            max-width: 450px;
            width: 90%;
        }

        h1 {
            color: #c084fc;
            font-size: 40px;
            margin-bottom: 15px;
            text-shadow: 0 0 15px purple;
        }

        p {
            color: #aaa;
            margin-bottom: 25px;
        }

        button {
            background: #9b4dff;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: #c084fc;
            transform: scale(1.1);
            box-shadow: 0 0 20px purple;
        }

        #message {
            margin-top: 25px;
            color: #c084fc;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>NEON WORLD</h1>

        <p>Welcome to my random HTML creation.</p>

        <button onclick="changeMessage()">
            CLICK ME
        </button>

        <div id="message">
            Ready for something cool?
        </div>
    </div>

    <script>
        const messages = [
            "✨ You're awesome!",
            "🚀 Keep exploring!",
            "🔥 Stay creative!",
            "💜 Welcome to the future!",
            "⚡ Never stop coding!"
        ];

        function changeMessage() {
            const randomIndex = Math.floor(
                Math.random() * messages.length
            );

            document.getElementById("message").textContent =
                messages[randomIndex];
        }
    </script>

</body>
</html>
